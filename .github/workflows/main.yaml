name: Wine CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Check Python code
        run: >
          python -m flake8 .
          --count
          --select=E9,F63,F7,F82
          --show-source
          --statistics
          --exclude=venv,.git,.dvc

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install API and test dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install pytest httpx

      - name: Run API tests
        run: python -m pytest test_main.py -v