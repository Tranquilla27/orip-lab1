name: Wine CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check pipeline startup
        run: echo "Lint stage started"

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check stage order
        run: echo "Test stage started after lint"